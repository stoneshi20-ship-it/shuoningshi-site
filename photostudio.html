<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Studio — Shuoning Shi</title>
  <meta name="description" content="Frame a photo, collage video + stills, or split a photo into a grid — all in your browser, on your device." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .studio-mode-wrap { max-width: var(--maxw); margin: 24px auto 26px; padding: 0 22px; display: flex; justify-content: flex-end; }
    #studio-mode { max-width: 300px; }
    .pane[hidden] { display: none; }
    /* Collage + Split share the Frame tool's layout & glass for a consistent look */
    .lc { max-width: var(--maxw); margin: 0 auto; padding: 0 22px clamp(3rem,8vh,6rem);
      display: grid; grid-template-columns: 1fr 300px; gap: 2rem; align-items: start; }
    @media (max-width: 780px){ .lc { grid-template-columns: 1fr; } }
    .lc__stage { position: relative; min-height: 60vh; min-height: 60dvh; display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius); background: var(--bg-elev); border: 1px solid var(--line); overflow: hidden; padding: 1.5rem; }
    #lc-canvas { max-width: 100%; max-height: 72vh; max-height: 72dvh; border-radius: 4px; box-shadow: var(--shadow); touch-action: none; cursor: pointer; background: transparent; }
    #lc-canvas.grabbing { cursor: grabbing; }
    #sp-canvas { max-width: 100%; max-height: 72vh; max-height: 72dvh; border-radius: 4px; box-shadow: var(--shadow); cursor: pointer; background: transparent; touch-action: none; }
    /* right control panel — same glass as the Frame panel */
    .lc__panel { display: flex; flex-direction: column; gap: 1.25rem; padding: 1.4rem; border-radius: 22px;
      background: var(--glass-nav); border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 12px 40px rgba(0,0,0,.20), inset 0 1px 0 var(--glass-edge); }
    .lc__g { display: flex; flex-direction: column; gap: 0.5rem; }
    .lc__lb { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    /* segmented controls — same pill look as .seg */
    .lc-seg { display: flex; width: 100%; gap: 2px; padding: 2px; border-radius: 980px; border: 1px solid var(--line); background: var(--glass); box-sizing: border-box; }
    .lc-seg button { flex: 1; min-width: 0; padding: 0 0.4rem; height: 28px; border-radius: 980px; border: none; background: transparent; color: var(--muted);      font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: background .2s ease, color .2s ease; font-family: inherit; white-space: nowrap; }
    .lc-seg button:hover { color: var(--fg); }
    .lc-seg button.on { background: var(--fg); color: var(--bg); }
    /* buttons — same as .btn-export */
    .lc-btn { font: inherit; font-size: 0.95rem; font-weight: 500; padding: 0.7rem 1rem; border-radius: 980px;
      border: 1px solid var(--line); background: var(--glass); color: var(--fg); cursor: pointer;
      transition: opacity .2s ease, transform .2s ease, border-color .2s ease; font-family: inherit; }
    .lc-btn:hover { border-color: var(--fg); }
    .lc-btn.primary { background: var(--fg); color: var(--btn-fg); border: none; }
    .lc-btn.primary:hover:not(:disabled) { opacity: .85; transform: scale(1.02); }
    .lc-btn:disabled { opacity: .45; cursor: not-allowed; }
    .lc-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .lc-row .lc-btn { flex: 0 0 auto; font-size: 0.8rem; font-weight: 500; padding: 0.4rem 0.9rem; white-space: nowrap; }
    .lc-hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
    .help { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1; cursor: help; user-select: none; -webkit-user-select: none; font-family: inherit; }
    .help[hidden] { display: none; }
    .help--top { width: 36px; height: 36px; font-size: 15px; }
    .help:hover, .help:focus-visible { color: var(--fg); border-color: var(--fg); outline: none; }
    .help__pop { position: absolute; top: calc(100% + 8px); right: 0; width: 250px; max-width: 72vw; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); color: var(--muted); font-size: 11px; font-weight: 400; line-height: 1.6; text-align: left; z-index: 30; display: none; }
    .help:hover .help__pop, .help:focus .help__pop, .help:focus-within .help__pop { display: block; }
    .help__pop b { color: var(--fg); font-weight: 600; }
    .sp-sel-grid { display: grid; gap: 4px; max-width: 132px; touch-action: none; user-select: none; -webkit-user-select: none; }
    .sp-cell { aspect-ratio: 1; border-radius: 6px; background: var(--glass); border: 1px solid var(--line); cursor: pointer; transition: background .08s; }
    .sp-cell.on { background: var(--fg); border-color: var(--fg); }
    /* ── mobile / tablet ── */
    @media (max-width: 620px){
      .studio-mode-wrap { justify-content: center; }
      .lc { padding: 0 16px clamp(2rem,6vh,4rem); }
      .lc__panel { padding: 1.1rem; }
    }
  </style>
</head>
<body>
  <header class="apptop">
    <a class="tool-cbtn" href="play.html" aria-label="Back to Playground" title="Back">←</a>
    <div>
      <div class="apptop__title">Photo Studio</div>
    </div>
    <div class="apptop__spacer"></div>
    <button class="tool-cbtn" data-export-code type="button" title="Download source code (open source)" aria-label="Download source code">⤓</button>
    <span class="help help--top" id="studio-help" tabindex="0" role="button" aria-label="How to use this tool">?<span class="help__pop" id="studio-help-pop"></span></span>
    <button id="theme-toggle" class="tool-cbtn" aria-label="Toggle dark and light mode" title="Toggle theme">
      <span class="theme-toggle__icon" aria-hidden="true">☾︎</span>
    </button>
  </header>

  <main>

    <div class="studio-mode-wrap">
      <div class="seg seg--frame" id="studio-mode">
        <button class="seg__btn is-active" data-m="frame" type="button">Frame</button>
        <button class="seg__btn" data-m="collage" type="button">Collage</button>
        <button class="seg__btn" data-m="split" type="button">Split</button>
      </div>
    </div>

    <!-- ============ FRAME (Photo Framer) ============ -->
    <section class="framer pane" id="pane-frame">
      <div>
        <div class="framer__stage" id="stage">
          <canvas id="framer-canvas" hidden></canvas>
          <label class="framer__drop" id="drop" for="file">
            <span>Click or drop a photo here<br /><small style="opacity:.6">JPG keeps camera info (EXIF)</small></span>
          </label>
          <input type="file" id="file" accept="image/*" hidden />
        </div>
        <button class="btn-change" id="rechoose" type="button" hidden>↻ Change photo</button>
      </div>
      <aside class="panel">
        <div class="panel__group">
          <span class="panel__label">Frame</span>
          <div class="seg seg--frame" id="type-seg">
            <button class="seg__btn is-active" data-type="polaroid" type="button">Polaroid</button>
            <button class="seg__btn" data-type="even" type="button">Even</button>
            <button class="seg__btn" data-type="gradient" type="button">Gradient</button>
          </div>
          <div class="seg seg--frame seg--size" id="size-seg"></div>
          <div class="seg seg--frame seg--orient" id="orient-seg" hidden>
            <button class="seg__btn is-active" data-orient="portrait" type="button">Portrait</button>
            <button class="seg__btn" data-orient="landscape" type="button">Landscape</button>
          </div>
          <div class="seg seg--frame" id="ratio-seg" hidden>
            <button class="seg__btn is-active" data-ratio="original" type="button">Orig</button>
            <button class="seg__btn" data-ratio="1:1" type="button">1:1</button>
            <button class="seg__btn" data-ratio="4:5" type="button">4:5</button>
            <button class="seg__btn" data-ratio="4:3" type="button">4:3</button>
            <button class="seg__btn" data-ratio="3:2" type="button">3:2</button>
            <button class="seg__btn" data-ratio="16:9" type="button">16:9</button>
          </div>
          <label class="framer-toggle" id="framecolor-row">Frame color
            <input type="color" id="m-border" value="#ffffff" /></label>
          <label class="framer-toggle" id="gradtoggle-row" hidden>Gradient overlay
            <span class="switch"><input type="checkbox" id="o-grad" checked /><span class="switch__track"></span></span></label>
          <label class="framer-toggle" id="grad-row" hidden>Gradient color
            <input type="color" id="m-grad" value="#000000" /></label>
        </div>
        <div class="panel__group" id="label-group">
          <span class="panel__label">Label</span>
          <label class="framer-toggle">Show label
            <span class="switch"><input type="checkbox" id="o-label" checked /><span class="switch__track"></span></span></label>
          <div class="panel__sub" id="label-sub">
            <textarea id="m-title" rows="2" placeholder="Title / place (e.g. Chicago)"></textarea>
            <input type="text" id="m-camera" placeholder="Camera (e.g. X100V)" />
            <input type="text" id="m-film" placeholder="Settings (ISO · mm · f · s)" />
            <label class="framer-toggle">Brand logo
              <span class="logo-ctl">
                <button id="logo-btn" type="button" class="mini-btn">Upload</button>
                <button id="logo-clear" type="button" class="mini-btn" title="Remove logo">✕</button>
              </span>
            </label>
            <input type="file" id="m-logo" accept="image/*" hidden />
            <label class="framer-toggle">Center logo
              <span class="seg seg--frame seg--size" id="center-seg">
                <button class="seg__btn is-active" data-c="none" type="button">None</button>
                <button class="seg__btn" data-c="mark" type="button">Mark</button>
                <button class="seg__btn" data-c="upload" type="button">Upload</button>
              </span>
            </label>
            <label class="framer-toggle" id="mark-row" hidden>Mark color
              <input type="color" id="m-mark" value="#4fb3d1" /></label>
            <input type="file" id="m-center" accept="image/*" hidden />
            <div class="swatch-head">
              <span class="panel__label" style="text-transform:none;letter-spacing:0">Swatches</span>
              <span class="swatch-count" id="sw-count">3</span>
              <button id="sw-minus" type="button" class="mini-btn" title="Fewer">−</button>
              <button id="sw-plus" type="button" class="mini-btn" title="More">+</button>
            </div>
            <div class="swatch-row" id="swatch-row"></div>
          </div>
        </div>
        <div class="panel__group">
          <span class="panel__label">Export size</span>
          <div class="seg seg--frame" id="export-seg">
            <button class="seg__btn is-active" data-x="original" type="button">Original</button>
            <button class="seg__btn" data-x="4k" type="button">4K</button>
            <button class="seg__btn" data-x="2k" type="button">2K</button>
          </div>
          <div class="seg seg--frame" id="fmt-seg">
            <button class="seg__btn is-active" data-f="png" type="button">PNG</button>
            <button class="seg__btn" data-f="jpeg" type="button">JPEG</button>
          </div>
        </div>
        <button class="btn-export" id="export" type="button">Download</button>
      </aside>
    </section>

    <!-- ============ COLLAGE (Live Collage) ============ -->
    <section class="lc pane" id="pane-collage" hidden>
      <div class="lc__stage"><canvas id="lc-canvas" width="1080" height="1080"></canvas></div>
      <aside class="lc__panel">
        <div class="lc__g"><span class="lc__lb">Layout</span>
          <div class="lc-seg" id="seg-layout">
            <button class="on" data-l="side">Side</button>
            <button data-l="stack">Stack</button>
            <button data-l="pip">PiP</button>
          </div>
        </div>
        <div class="lc__g"><span class="lc__lb">Aspect</span>
          <div class="lc-seg" id="seg-ratio">
            <button class="on" data-r="original">Orig</button>
            <button data-r="1:1">1:1</button>
            <button data-r="4:5">4:5</button>
            <button data-r="4:3">4:3</button>
            <button data-r="3:2">3:2</button>
            <button data-r="16:9">16:9</button>
          </div>
        </div>
        <div class="lc__g" id="orient-g" style="display:none"><span class="lc__lb">Orientation</span>
          <div class="lc-seg" id="seg-orient">
            <button class="on" data-o="portrait">Portrait</button>
            <button data-o="landscape">Landscape</button>
          </div>
        </div>
        <div class="lc-row">
          <button class="lc-btn" id="btn-swap">⇄ Swap</button>
          <button class="lc-btn" id="btn-addlayer">＋ Add photo</button>
        </div>
        <div class="lc__g"><span class="lc__lb">Export</span>
          <div class="lc-seg" id="lc-size"><button class="on" data-x="original">Original</button><button data-x="4k">4K</button><button data-x="2k">2K</button></div>
          <div class="lc-seg" id="lc-fmt"><button class="on" data-f="png">PNG</button><button data-f="jpeg">JPEG</button></div>
          <button class="lc-btn primary" id="btn-video" disabled>Export moving collage</button>
          <button class="lc-btn" id="btn-png" disabled>Export still</button>
        </div>
      </aside>
    </section>

    <!-- ============ SPLIT (Grid Splitter) ============ -->
    <section class="lc pane" id="pane-split" hidden>
      <div class="lc__stage"><canvas id="sp-canvas" width="1080" height="1080"></canvas></div>
      <aside class="lc__panel">
        <div class="lc__g"><span class="lc__lb">Split · drag to choose</span>
          <div id="sp-sel-grid" class="sp-sel-grid"></div>
        </div>
        <div class="lc__g"><span class="lc__lb">Export</span>
          <div class="lc-seg" id="sp-size"><button class="on" data-x="original">Original</button><button data-x="4k">4K</button><button data-x="2k">2K</button></div>
          <div class="lc-seg" id="sp-fmt"><button class="on" data-f="png">PNG</button><button data-f="jpeg">JPEG</button></div>
          <button class="lc-btn primary" id="sp-export-all" disabled>Split into pieces</button>
        </div>
      </aside>
    </section>

  </main>

  <footer class="footer"><p>© <span id="year"></span> Shuoning Shi. All rights reserved.</p></footer>

  <video id="lc-video" playsinline muted loop hidden></video>
  <input type="file" id="file-any" accept="image/*,video/*" hidden>
  <input type="file" id="file-split" accept="image/*" hidden>

  <script src="script.js"></script>
  <script src="markdata.js"></script>
  <script src="framer.js"></script>
  <script src="codeexport.js"></script>
  <script>
  /* mode toggle + contextual help */
  (function(){ var seg=document.getElementById("studio-mode");
    var HELP={
      frame:'<b>Drag</b> to reposition · <b>scroll</b> to zoom. Pick a frame style, size, aspect, and colors on the left, then <b>Download</b>.',
      collage:'<b>Click a box</b> to add a photo / video / Live Photo — or <b>drop</b> a file on it.<br><b>Add photo</b> stacks extras on top: <b>drag</b> to move · <b>corner dot</b> to resize (hold <b>Shift</b> for ratio) · <b>✕</b> to remove · <b>double-click</b> to reshape.<br><b>Scroll</b> to zoom. Side / Stack: drag the divider. PiP: drag the small window or its corner dot.<br><b>Moving collage</b> records once (no sound); needs a moving box (video / Live Photo / GIF).',
      split:'<b>Click / drop</b> a photo on the box. <b>Drag</b> across the squares to choose how to divide it — a 2-wide block splits the whole image into 2, 3-wide into 3, a 2×2 into 4, and so on. The preview shows the cut lines.'
    };
    function setHelp(m){ var p=document.getElementById("studio-help-pop"); if(p) p.innerHTML=HELP[m]||""; }
    setHelp("frame");
    seg.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return;
      seg.querySelectorAll("button").forEach(function(x){x.classList.toggle("is-active",x===b);});
      var m=b.dataset.m;
      document.getElementById("pane-frame").hidden = m!=="frame";
      document.getElementById("pane-collage").hidden = m!=="collage";
      document.getElementById("pane-split").hidden = m!=="split";
      setHelp(m);
    });
  })();
  </script>
  <script>
  /* ===== Live Collage ===== */
  (function () {
    var cv = document.getElementById("lc-canvas"), ctx = cv.getContext("2d");
    var layout = "side", ratio = "original", corient = "portrait", swap = false, recording = false, showHandle = true;
    var overlays = [], selOv = -1, addingOverlay = false;   // extra photos stacked on top (multi-inset)
    var split = 0.5, insetSize = 0.34, insetW = 0.42, insetH = 0.30, insetAuto = true, insetPos = { x: 0.72, y: 0.72 };
    var SHAPES = ["freerect","rect","circle","star","heart"], HEART_AR = 1.1, RECT_AR = 4/3;   // freerect = free aspect (default); rect = locked ratio
    var RATIOS = { "1:1":1, "4:5":5/4, "4:3":4/3, "3:2":3/2, "16:9":16/9 }, CBASE = 1440;   // landscape aspects; orientation flips them
    function newSlot(){ return { kind:null, el:null, w:0, h:0, zoom:1, px:0, py:0, shape:"freerect", frames:null, gifStart:0, gifTotal:0, _url:null }; }
    var slots = { A:newSlot(), B:newSlot() }, pendingSlot=null;
    var fileInput=document.getElementById("file-any");
    function baseSlot(){ var b=slots[swap?"B":"A"]; if(b&&b.w) return b; return slots.A.w?slots.A:(slots.B.w?slots.B:null); }
    function currentAspectC(){ if(ratio==="original"){ var b=baseSlot(); return (b&&b.w&&b.h)?b.w/b.h:1; } var r=RATIOS[ratio]||1; return (corient==="portrait"&&ratio!=="1:1")?1/r:r; }
    function applyCanvas(){ var ar=currentAspectC(), W,H; if(ar>=1){ W=CBASE; H=Math.round(CBASE/ar); } else { H=CBASE; W=Math.round(CBASE*ar); }
      if(cv.width!==W) cv.width=W; if(cv.height!==H) cv.height=H; }
    function setRatio(r){ ratio=r; applyCanvas(); syncOrientC(); }
    function syncOrientC(){ var g=document.getElementById("orient-g"); if(g) g.style.display=(ratio==="original"||ratio==="1:1")?"none":""; }
    setRatio("original");
    var UIFONT='-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif';
    function pRect(x,y,w,h){ ctx.beginPath(); ctx.rect(x,y,w,h); }
    function pRound(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath();
      if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); } else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); } }
    function dropCard(dx,dy,dw,dh,sub){ var inset=Math.max(3,Math.min(dw,dh)*0.02), rad=Math.min(dw,dh)*0.05, m=Math.min(dw,dh);
      ctx.save(); pRound(dx+inset,dy+inset,dw-2*inset,dh-2*inset,rad); ctx.fillStyle="rgba(128,128,128,.07)"; ctx.fill();
      ctx.strokeStyle="rgba(140,140,140,.4)"; ctx.lineWidth=Math.max(1,cv.width*0.0015); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillStyle="rgba(110,110,110,.9)"; ctx.font="400 "+Math.round(m*0.05)+"px "+UIFONT; ctx.fillText("Click or drop a photo here", dx+dw/2, dy+dh/2-m*0.035);
      ctx.fillStyle="rgba(140,140,140,.7)"; ctx.font="400 "+Math.round(m*0.038)+"px "+UIFONT; ctx.fillText(sub, dx+dw/2, dy+dh/2+m*0.05); ctx.restore(); }
    function pEll(x,y,w,h){ ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2); ctx.closePath(); }
    function pStar(x,y,w,h){ var cx=x+w/2,cy=y+h/2,m=Math.min(w,h)/2,rot=-Math.PI/2; ctx.beginPath();
      for(var i=0;i<10;i++){ var a=rot+i*Math.PI/5, rad=(i%2===0)?m:m*0.46, px=cx+Math.cos(a)*rad*(w/Math.min(w,h)), py=cy+Math.sin(a)*rad*(h/Math.min(w,h)); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); } ctx.closePath(); }
    function pHeart(x,y,w,h){ ctx.beginPath();
      ctx.moveTo(x+0.50*w, y+0.294*h);
      ctx.bezierCurveTo(x+0.50*w,y+0.118*h, x+0.35*w,y+0.00*h,  x+0.20*w,y+0.00*h);
      ctx.bezierCurveTo(x+0.05*w,y+0.00*h,  x+0.00*w,y+0.176*h, x+0.00*w,y+0.294*h);
      ctx.bezierCurveTo(x+0.00*w,y+0.47*h,  x+0.15*w,y+0.647*h, x+0.50*w,y+1.00*h);
      ctx.bezierCurveTo(x+0.85*w,y+0.647*h, x+1.00*w,y+0.47*h,  x+1.00*w,y+0.294*h);
      ctx.bezierCurveTo(x+1.00*w,y+0.176*h, x+0.95*w,y+0.00*h,  x+0.80*w,y+0.00*h);
      ctx.bezierCurveTo(x+0.65*w,y+0.00*h,  x+0.50*w,y+0.118*h, x+0.50*w,y+0.294*h);
      ctx.closePath(); }
    function shapeAR(sh){ return sh==="heart"?HEART_AR:(sh==="square"||sh==="circle"||sh==="star")?1:null; }
    function boxAR(sh){ return sh==="heart"?HEART_AR:sh==="rect"?RECT_AR:1; }   // inset box ratio for locked shapes
    function insetKey(){ return swap?"A":"B"; }
    function insetShape(){ return slots[insetKey()].shape; }
    function shapePath(sh,x,y,w,h){ var ar=shapeAR(sh); if(ar==null){ pRect(x,y,w,h); return; }
      var bw=w,bh=w/ar; if(bh>h){ bh=h; bw=h*ar; } var ox=x+(w-bw)/2, oy=y+(h-bh)/2;
      if(sh==="circle")pEll(ox,oy,bw,bh); else if(sh==="star")pStar(ox,oy,bw,bh); else if(sh==="heart")pHeart(ox,oy,bw,bh); else pRect(ox,oy,bw,bh); }
    function drawSlotObj(sl,dx,dy,dw,dh){
      if(!sl.el||!sl.w){ dropCard(dx,dy,dw,dh,"photo · video · Live · GIF"); return; }

      try{ rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:10000000}:undefined); }catch(e){ alert("Recording failed: "+e.message); recording=false; btn.textContent="Export moving collage"; btn.disabled=false; return; }
      var chunks=[]; rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
      rec.onstop=function(){ showHandle=true; var ext=(mime.indexOf("mp4")>=0)?"mp4":"webm", blob=new Blob(chunks,{type:mime||"video/webm"}), a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="live-collage."+ext; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},4000); recording=false; btn.textContent="Export moving collage"; btn.disabled=false; };
      ["A","B"].forEach(function(k){ var sl=slots[k]; if(sl.kind==="video"){ try{ sl.el.currentTime=0; }catch(e){} } else if(sl.kind==="gif"){ sl.gifStart=performance.now(); } });
      overlays.forEach(function(sl){ if(sl.kind==="video"){ try{ sl.el.currentTime=0; }catch(e){} } else if(sl.kind==="gif"){ sl.gifStart=performance.now(); } });
      showHandle=false; render(); rec.start(); setTimeout(function(){ if(rec.state!=="inactive") rec.stop(); }, Math.min(10000,Math.max(1500,maxDur()*1000+120))); });
  })();
  </script>
  <script>
  /* ===== Split (Grid crop + selection) ===== */
  (function () {
    var cv = document.getElementById("sp-canvas"), ctx = cv.getContext("2d");
    var fileInput = document.getElementById("file-split");
    var gridEl = document.getElementById("sp-sel-grid");
    var img = null, cols = 3, rows = 3;
    var selecting = false, startRC = [0,0], endRC = [0,0], sel = { r0:0, c0:0, r1:0, c1:0 };
    function inSel(r,c){ return r>=sel.r0&&r<=sel.r1&&c>=sel.c0&&c<=sel.c1; }
    function applySel(){ sel={ r0:Math.min(startRC[0],endRC[0]), r1:Math.max(startRC[0],endRC[0]), c0:Math.min(startRC[1],endRC[1]), c1:Math.max(startRC[1],endRC[1]) };
      gridEl.querySelectorAll(".sp-cell").forEach(function(d){ d.classList.toggle("on", inSel(+d.dataset.r,+d.dataset.c)); }); render(); }
    function buildSelector(){ gridEl.innerHTML=""; gridEl.style.gridTemplateColumns="repeat("+cols+",1fr)";
      for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){ (function(r,c){ var d=document.createElement("div"); d.className="sp-cell"; d.dataset.r=r; d.dataset.c=c;
        d.addEventListener("pointerdown",function(e){ e.preventDefault(); selecting=true; startRC=[r,c]; endRC=[r,c]; applySel(); });
        d.addEventListener("pointerenter",function(){ if(selecting){ endRC=[r,c]; applySel(); } });
        gridEl.appendChild(d); })(r,c); }
      applySel(); }
    // touch: pointerenter doesn't fire mid-drag, so hit-test the cell under the finger
    gridEl.addEventListener("pointermove",function(e){ if(!selecting)return; e.preventDefault();
      var el=document.elementFromPoint(e.clientX,e.clientY);
      if(el&&el.classList.contains("sp-cell")){ endRC=[+el.dataset.r,+el.dataset.c]; applySel(); } });
    window.addEventListener("pointerup",function(){ selecting=false; });
    function fitCanvas(){ if(!img){ cv.width=1080; cv.height=1080; return; }
      var maxW=1080, s=Math.min(1,maxW/img.naturalWidth); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s); }
    function render(){ ctx.clearRect(0,0,cv.width,cv.height); ctx.imageSmoothingEnabled=true; if("imageSmoothingQuality" in ctx) ctx.imageSmoothingQuality="high";
      if(!img){ var m=Math.min(cv.width,cv.height), inset=Math.max(3,m*0.02), rad=m*0.05, W=cv.width,H=cv.height;
        ctx.save(); ctx.beginPath();
        if(ctx.roundRect){ ctx.roundRect(inset,inset,W-2*inset,H-2*inset,rad); } else { var r=rad,x=inset,y=inset,w=W-2*inset,h=H-2*inset; ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
        ctx.fillStyle="rgba(128,128,128,.07)"; ctx.fill(); ctx.strokeStyle="rgba(140,140,140,.4)"; ctx.lineWidth=Math.max(1,cv.width*0.0015); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillStyle="rgba(110,110,110,.9)"; ctx.font='400 '+Math.round(m*0.05)+'px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif'; ctx.fillText("Click or drop a photo here", W/2, H/2-m*0.035);
        ctx.fillStyle="rgba(140,140,140,.7)"; ctx.font='400 '+Math.round(m*0.038)+'px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif'; ctx.fillText("JPG · PNG", W/2, H/2+m*0.05); ctx.restore(); return; }
      ctx.drawImage(img,0,0,cv.width,cv.height);
      // the selection's dimensions = how many equal columns/rows to split the WHOLE image into
      var nc=sel.c1-sel.c0+1, nr=sel.r1-sel.r0+1;
      ctx.save(); ctx.lineWidth=Math.max(2,cv.width*0.004);
      for(var cc=1;cc<nc;cc++){ var x=Math.round(cc*cv.width/nc)+.5;
        ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.height); ctx.stroke();
        ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.moveTo(x-1.5,0); ctx.lineTo(x-1.5,cv.height); ctx.stroke(); }
      for(var rr=1;rr<nr;rr++){ var y=Math.round(rr*cv.height/nr)+.5;
        ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.width,y); ctx.stroke();
        ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.moveTo(0,y-1.5); ctx.lineTo(cv.width,y-1.5); ctx.stroke(); }
      ctx.restore(); }
    function loadFile(file){ if(!file)return; var url=URL.createObjectURL(file), i=new Image();
      i.onload=function(){ img=i; fitCanvas(); render(); document.getElementById("sp-export-all").disabled=false; URL.revokeObjectURL(url); };
      i.onerror=function(){ URL.revokeObjectURL(url); alert("This file couldn't be read — likely a HEIC photo.\nExport it as JPEG in the Photos app (or use jpg / png)."); }; i.src=url; }
    buildSelector(); render();
    cv.addEventListener("click",function(){ fileInput.click(); });
    fileInput.addEventListener("change",function(){ if(fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value=""; });
    ["dragenter","dragover"].forEach(function(ev){ cv.addEventListener(ev,function(e){ e.preventDefault(); }); });
    cv.addEventListener("drop",function(e){ e.preventDefault(); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
    function dl(blob,name){ if(!blob)return; var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000); }
    document.getElementById("sp-fmt").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return; this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);}); });
    function spFmt(){ var b=document.querySelector("#sp-fmt button.on"); return b?b.dataset.f:"png"; }
    document.getElementById("sp-size").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return; this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);}); });
    function spSize(){ var b=document.querySelector("#sp-size button.on"); return b?b.dataset.x:"original"; }
    function cropCanvas(sx,sy,sw,sh,fmt,f){ f=f||1; var ow=Math.max(1,Math.round(sw*f)), oh=Math.max(1,Math.round(sh*f)); var oc=document.createElement("canvas"); oc.width=ow; oc.height=oh; var octx=oc.getContext("2d");
      octx.imageSmoothingEnabled=true; if("imageSmoothingQuality" in octx) octx.imageSmoothingQuality="high";
      if(fmt==="jpeg"){ octx.fillStyle="#fff"; octx.fillRect(0,0,ow,oh); } octx.drawImage(img,sx,sy,sw,sh,0,0,ow,oh); return oc; }
    // Split the WHOLE image into (selected columns × rows) equal pieces
    document.getElementById("sp-export-all").addEventListener("click",function(){ if(!img)return; var btn=this; btn.disabled=true; var fmt=spFmt(), size=spSize();
      var mime=fmt==="jpeg"?"image/jpeg":"image/png", ext=fmt==="jpeg"?"jpg":"png", q=fmt==="jpeg"?(size==="original"?0.98:0.95):undefined;
      var W=img.naturalWidth, H=img.naturalHeight, nc=sel.c1-sel.c0+1, nr=sel.r1-sel.r0+1, jobs=[], n=1;
      var f=size==="original"?1:(size==="4k"?4096:2048)/Math.max(W,H);
      for(var r=0;r<nr;r++) for(var c=0;c<nc;c++){
        var sx=Math.round(c*W/nc), sy=Math.round(r*H/nr), sw=Math.round((c+1)*W/nc)-sx, sh=Math.round((r+1)*H/nr)-sy;
        jobs.push({ sx:sx, sy:sy, sw:sw, sh:sh, n:n++ }); }
      var i=0; (function next(){ if(i>=jobs.length){ btn.disabled=false; return; } var j=jobs[i++];
        var oc=cropCanvas(j.sx,j.sy,j.sw,j.sh,fmt,f);
        oc.toBlob(function(blob){ dl(blob,"split-"+nc+"x"+nr+"-"+j.n+"."+ext); setTimeout(next,350); },mime,q); })(); });
  })();
  </script>
