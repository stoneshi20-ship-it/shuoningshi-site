<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Labyrinth — embedded prototype</title>
  <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{ background:#f6f2ea;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; overflow:hidden; touch-action:none; }
    #lab-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:none; }
    .breath{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; z-index:5; }
    .breath .word{ font-size:clamp(1rem,2.6vw,1.3rem); font-weight:600; letter-spacing:.02em; color:#2a2622; }
    .breath .sub{ font-size:.72rem; color:#9a938a; margin-top:3px; letter-spacing:.06em; text-transform:uppercase; }
    .ctl{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:12px;
      background:rgba(0,0,0,.04); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(0,0,0,.12); border-radius:999px; padding:7px 14px; z-index:6; }
    .ctl label{ display:inline-flex; align-items:center; gap:7px; color:#6f6a63; font-size:.82rem; cursor:pointer; user-select:none; }
    .ctl input{ accent-color:#c98a4a; }
    .ctl .sep{ width:1px; height:15px; background:rgba(0,0,0,.12); }
    .ctl .pace{ color:#6f6a63; font-size:.8rem; } .ctl .pace b{ color:#2a2622; font-weight:600; }
  </style>
</head>
<body>
  <canvas id="lab-canvas"></canvas>
  <div class="breath"><div class="word" id="lab-word">Breathe in</div><div class="sub" id="lab-sub">follow the light inward</div></div>
  <div class="ctl">
    <label><input type="checkbox" id="lab-guide" checked /> Guide light</label>
    <span class="sep"></span><span class="pace">In <b>5s</b> · out <b>7s</b></span>
  </div>
  <script>
  (function(){
    var canvas=document.getElementById("lab-canvas"), ctx=canvas.getContext("2d");
    var wordEl=document.getElementById("lab-word"), subEl=document.getElementById("lab-sub"), guideChk=document.getElementById("lab-guide");
    var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    var W=0,H=0,cx=0,cy=0,rMax=0,rMin=0,channel=0,threshold=0,pts=[],cum=[],total=0,TURNS=2.25,SAMPLES=2200;
    function layout(){
      W=window.innerWidth; H=window.innerHeight;
      canvas.style.width=W+"px"; canvas.style.height=H+"px";
      canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
      cx=W/2; cy=H/2; var span=Math.min(W,H);
      rMax=span*0.42; rMin=span*0.075; channel=Math.max(14,span*0.05); threshold=channel*0.75+span*0.02;
      buildPath();
    }
    function buildPath(){
      pts=[];cum=[];total=0; var thetaMax=TURNS*Math.PI*2;
      for(var i=0;i<SAMPLES;i++){ var u=i/(SAMPLES-1),theta=u*thetaMax,r=rMax-(rMax-rMin)*u; pts.push({x:cx+r*Math.cos(theta),y:cy+r*Math.sin(theta)}); }
      cum.push(0); for(var j=1;j<pts.length;j++){ var dx=pts[j].x-pts[j-1].x,dy=pts[j].y-pts[j-1].y; total+=Math.hypot(dx,dy); cum.push(total); }
    }
    function pointAt(f){ f=Math.max(0,Math.min(1,f)); var target=f*total,lo=0,hi=cum.length-1;
      while(lo<hi){var mid=(lo+hi)>>1; if(cum[mid]<target)lo=mid+1; else hi=mid;} var i=Math.max(1,lo),seg=cum[i]-cum[i-1]||1,t=(target-cum[i-1])/seg;
      return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*t, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*t}; }
    function idxAt(f){ f=Math.max(0,Math.min(1,f)); var target=f*total,lo=0,hi=cum.length-1;
      while(lo<hi){var mid=(lo+hi)>>1; if(cum[mid]<target)lo=mid+1; else hi=mid;} return lo; }
    function nearest(px,py){ var best=Infinity,bi=0; for(var i=0;i<pts.length;i++){var dx=pts[i].x-px,dy=pts[i].y-py,d=dx*dx+dy*dy; if(d<best){best=d;bi=i;}}
      return {dist:Math.sqrt(best),frac:cum[bi]/total,x:pts[bi].x,y:pts[bi].y}; }
    var IN=5000,HOLD1=1000,OUT=7000,HOLD2=1200,CYCLE=IN+HOLD1+OUT+HOLD2;
    function smooth(t){return t*t*(3-2*t);}
    function breath(el){ var p=el%CYCLE,g,ring,word,sub;
      if(p<IN){var u=smooth(p/IN);g=u;ring=u;word="Breathe in";sub="follow the light inward";}
      else if(p<IN+HOLD1){g=1;ring=1;word="Hold";sub="at the center";}
      else if(p<IN+HOLD1+OUT){var u2=smooth((p-IN-HOLD1)/OUT);g=1-u2;ring=1-u2;word="Breathe out";sub="trace back outward";}
      else{g=0;ring=0;word="Hold";sub="rest";} return {g:g,ring:ring,word:word,sub:sub}; }
    var ptr={x:0,y:0,seen:false,on:false,frac:0,sx:0,sy:0};
    function onMove(e){ var rect=canvas.getBoundingClientRect(),t=(e.touches&&e.touches[0])||e,x=t.clientX-rect.left,y=t.clientY-rect.top,n=nearest(x,y);
      ptr.x=x;ptr.y=y;ptr.seen=true;ptr.on=n.dist<threshold;ptr.frac=n.frac;ptr.sx=n.x;ptr.sy=n.y; }
    canvas.addEventListener("pointermove",onMove); canvas.addEventListener("pointerdown",onMove);
    canvas.addEventListener("pointerleave",function(){ptr.on=false;});
    var lastWord="";
    function draw(ts){
      var st=breath(ts),guideOn=guideChk.checked;
      ctx.clearRect(0,0,W,H); ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
      ctx.lineWidth=channel; ctx.strokeStyle="rgba(0,0,0,0.05)"; ctx.stroke();
      ctx.lineWidth=Math.max(2,channel*0.14); ctx.strokeStyle="rgba(0,0,0,0.14)"; ctx.stroke();
      var inSync=ptr.on&&guideOn&&Math.abs(ptr.frac-st.g)<0.06;
      if(ptr.on){ var a=idxAt(Math.max(0,ptr.frac-0.10)),b=idxAt(Math.min(1,ptr.frac+0.02));
        ctx.beginPath(); for(var k=a;k<=b;k++)(k===a?ctx.moveTo:ctx.lineTo).call(ctx,pts[k].x,pts[k].y);
        ctx.lineWidth=channel*0.5; ctx.strokeStyle=inSync?"rgba(240,150,60,0.7)":"rgba(220,150,90,0.4)";
        ctx.shadowBlur=18; ctx.shadowColor=inSync?"rgba(255,170,80,0.85)":"rgba(230,160,90,0.55)"; ctx.stroke(); ctx.shadowBlur=0; }
      // center dish — the spiral flows into it
      ctx.beginPath(); ctx.arc(cx,cy,rMin,0,Math.PI*2); ctx.fillStyle="rgba(0,0,0,0.04)"; ctx.fill(); ctx.lineWidth=1.4; ctx.strokeStyle="rgba(0,0,0,0.16)"; ctx.stroke();
      ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,channel*0.28,0,Math.PI*2); ctx.fillStyle="rgba(0,0,0,0.28)"; ctx.fill();
      if(guideOn){ var gp=pointAt(st.g),grad=ctx.createRadialGradient(gp.x,gp.y,0,gp.x,gp.y,channel*1.5);
        grad.addColorStop(0,"rgba(255,210,150,0.98)"); grad.addColorStop(0.4,"rgba(240,160,70,0.6)"); grad.addColorStop(1,"rgba(240,160,70,0)");
        ctx.beginPath(); ctx.arc(gp.x,gp.y,channel*1.5,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
        ctx.beginPath(); ctx.arc(gp.x,gp.y,channel*0.22,0,Math.PI*2); ctx.fillStyle="#fff3e0"; ctx.fill(); }
      if(ptr.seen){ var fx=ptr.on?ptr.sx:ptr.x,fy=ptr.on?ptr.sy:ptr.y;
        ctx.beginPath(); ctx.arc(fx,fy,channel*0.30,0,Math.PI*2); ctx.fillStyle=ptr.on?"#e8892f":"rgba(0,0,0,0.4)"; ctx.fill();
        ctx.beginPath(); ctx.arc(fx,fy,channel*0.30,0,Math.PI*2); ctx.lineWidth=1.5; ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.stroke(); }
      if(st.word!==lastWord){wordEl.textContent=st.word;subEl.textContent=st.sub;lastWord=st.word;}
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize",layout); layout(); requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
